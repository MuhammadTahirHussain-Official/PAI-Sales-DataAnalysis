[theme]
base = "dark"
primaryColor = "#FF8A4C"
backgroundColor = "#0E0F11"
secondaryBackgroundColor = "#1A1B1F"
textColor = "#EDEAE3"
font = "Hanken Grotesk:https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
borderColor = "#2A2B30"
baseRadius = "12px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
